<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>MMPlayer Cast</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 3vh 4vw;
            background-color: #0E0E0E;
            color: #FFFFFF;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        #background-blur {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-size: cover;
            background-position: center;
            filter: blur(40px) brightness(0.45);
            transform: scale(1.1);
            z-index: -2;
            transition: background-image 0.6s ease;
        }

        #background-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, rgba(14, 14, 14, 0.4) 0%, rgba(14, 14, 14, 0.85) 75%, #0E0E0E 100%);
            z-index: -1;
        }

        .main-container {
            display: flex;
            flex-direction: row;
            width: 100%;
            max-width: 1350px;
            height: 100%;
            gap: clamp(24px, 4vw, 56px);
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        .left-column {
            flex: 0 0 clamp(280px, 32vw, 420px);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
            justify-content: center;
        }

        .artwork-wrapper {
            position: relative;
            width: min(320px, 36vh);
            height: min(320px, 36vh);
            margin-bottom: 20px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
            background: #181818;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .info-wrapper {
            width: 100%;
            margin-bottom: 14px;
        }

        .title {
            font-size: clamp(20px, 2.5vw, 28px);
            font-weight: 800;
            color: #FFFFFF;
            margin: 0 0 4px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: -0.3px;
        }

        .artist {
            font-size: clamp(13px, 1.5vw, 17px);
            font-weight: 600;
            color: rgba(255, 255, 255, 0.65);
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-controls {
            width: 100%;
            padding: 8px 0;
            margin-bottom: 14px;
        }

        .progress-container {
            width: 100%;
            margin-bottom: 8px;
        }

        .progress-bar-container {
            width: 100%;
            height: 5px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.15);
            position: relative;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #A78BFA, #FFFFFF);
            transition: width 0.15s linear;
        }

        .time-container {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 600;
            margin-top: 6px;
        }

        .right-column {
            flex: 1;
            height: 84vh;
            display: block;
            overflow: hidden;
            position: relative;
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
        }

        .lyrics-scroller {
            display: flex;
            flex-direction: column;
            gap: 22px;
            padding: 38vh 0;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform;
        }

        .lyric-line {
            font-size: clamp(18px, 2.2vw, 26px);
            font-weight: 700;
            color: rgba(255, 255, 255, 0.25);
            transition: color 0.3s ease, transform 0.3s ease, text-shadow 0.3s ease, font-weight 0.3s ease;
            transform-origin: left center;
            cursor: default;
            user-select: none;
            line-height: 1.4;
        }

        .lyric-line.active {
            color: #FFFFFF !important;
            transform: scale(1.08);
            font-weight: 800;
            text-shadow: 0 0 24px rgba(255, 255, 255, 0.5);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            background-color: rgba(139, 92, 246, 0.2);
            color: #A78BFA;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            cursor: default;
        }

        .beta-badge {
            display: inline-block;
            padding: 3px 6px;
            border-radius: 6px;
            font-size: 9px;
            font-weight: 800;
            background-color: rgba(245, 158, 11, 0.15);
            color: #F59E0B;
            border: 1px solid rgba(245, 158, 11, 0.25);
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        @media (max-width: 820px) {
            body {
                padding: 16px;
                overflow-y: auto;
                height: auto;
                min-height: 100vh;
            }

            .main-container {
                flex-direction: column;
                height: auto;
                gap: 24px;
            }

            .left-column {
                flex: none;
                width: 100%;
                max-width: 100%;
                align-items: center;
                text-align: center;
            }

            .artwork-wrapper {
                width: 220px;
                height: 220px;
                margin-bottom: 14px;
            }

            .title, .artist {
                text-align: center;
            }

            .lyric-line {
                text-align: center;
                transform-origin: center center;
            }

            .right-column {
                width: 100%;
                height: 300px;
                flex: none;
            }
        }
    </style>
</head>
<body>
    <div id="background-blur"></div>
    <div id="background-overlay"></div>

    <div class="main-container">
        <div class="left-column">
            <div class="artwork-wrapper">
                <img id="cover" class="cover" src="" alt="Album Cover">
            </div>
            <div class="info-wrapper">
                <div id="title" class="title">No hay canción</div>
                <div id="artist" class="artist"></div>
            </div>
            <div class="player-controls">
                <div class="progress-container">
                    <div class="progress-bar-container">
                        <div id="progress-fill" class="progress-fill"></div>
                    </div>
                    <div class="time-container">
                        <span id="time-current">0:00</span>
                        <span id="time-total">0:00</span>
                    </div>
                </div>
            </div>
            <audio id="audio-player" preload="auto"></audio>
            <div style="display: flex; flex-direction: row; align-items: center; gap: 8px; align-self: flex-start;">
                <div class="status-badge" id="sync-status">No hay canción</div>
                <div class="beta-badge">MMPlayer</div>
            </div>
        </div>

        <div class="right-column">
            <div id="lyrics-scroller" class="lyrics-scroller">
                <div class="lyric-line" style="text-align: center;">No hay letras cargadas</div>
            </div>
        </div>
    </div>

    <script>
        const audioPlayer      = document.getElementById('audio-player');
        const titleEl          = document.getElementById('title');
        const artistEl         = document.getElementById('artist');
        const coverEl          = document.getElementById('cover');
        const statusEl         = document.getElementById('sync-status');
        const backgroundBlur   = document.getElementById('background-blur');
        const lyricsScroller   = document.getElementById('lyrics-scroller');
        const progressFill     = document.getElementById('progress-fill');
        const timeCurrentEl    = document.getElementById('time-current');
        const timeTotalEl      = document.getElementById('time-total');

        audioPlayer.volume = 1.0;

        // ─── State ───────────────────────────────────────────────────────────────
        let currentSongTitle   = "";
        let isFetchingAudio    = false;
        let lyrics             = [];
        let currentActiveIndex = -1;
        let isAutoplayBlocked  = false;
        let lastActionTime     = 0;
        let currentLyricsLRC   = null;
        let currentCoverToken  = null;
        let serverBase         = "";

        function resetToIdle(statusMessage) {
            audioPlayer.pause();
            audioPlayer.removeAttribute('src');
            currentSongTitle   = "";
            currentLyricsLRC   = null;
            currentCoverToken  = null;
            currentActiveIndex = -1;
            
            titleEl.innerText  = "No hay canción";
            artistEl.innerText = "";
            updateCover(null);
            renderLyrics('');
            progressFill.style.width = '0%';
            timeCurrentEl.innerText  = '0:00';
            timeTotalEl.innerText    = '0:00';
            
            statusEl.innerText = statusMessage || "No hay canción";
            statusEl.style.backgroundColor = "rgba(239,68,68,0.2)";
            statusEl.style.color = "#FCA5A5";
            statusEl.style.cursor = "default";
            statusEl.onclick = null;
        }

        // Detect URL query parameters for dynamic server host
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('server')) {
            serverBase = urlParams.get('server').replace(/[\/]+$/, '');
        } else if (urlParams.has('host')) {
            const host = urlParams.get('host');
            const port = urlParams.get('port') || '8080';
            serverBase = 'http://' + host + ':' + port;
        }

        // Initialize Google Cast CAF Receiver if available
        if (typeof cast !== 'undefined' && cast.framework) {
            try {
                const castContext = cast.framework.CastReceiverContext.getInstance();
                const CAST_NAMESPACE = 'urn:x-cast:com.pescalerag.mmplayer';

                castContext.addCustomMessageListener(CAST_NAMESPACE, (customEvent) => {
                    console.log('[CAF Receiver] Received custom message:', customEvent);
                    try {
                        const data = typeof customEvent.data === 'string' ? JSON.parse(customEvent.data) : customEvent.data;
                        if (data && data.serverUrl) {
                            serverBase = data.serverUrl.replace(/[\/]+$/, '');
                            console.log('[CAF Receiver] serverBase updated to:', serverBase);
                            updateState();
                        }
                    } catch (e) {
                        console.error('[CAF Receiver] Error handling custom message:', e);
                    }
                });

                const playerManager = castContext.getPlayerManager();
                playerManager.setMessageInterceptor(
                    cast.framework.messages.MessageType.LOAD,
                    (loadRequestData) => {
                        console.log('[CAF Receiver] Intercepted LOAD request', loadRequestData);
                        if (loadRequestData.media && loadRequestData.media.customData && loadRequestData.media.customData.serverUrl) {
                            serverBase = loadRequestData.media.customData.serverUrl.replace(/[\/]+$/, '');
                            console.log('[CAF Receiver] serverBase updated from LOAD request to:', serverBase);
                            updateState();
                        }
                        return loadRequestData;
                    }
                );

                castContext.start({
                    disableIdleTimeout: true,
                    maxInactivity: 3600,
                });
                console.log('[CAF Receiver] CastReceiverContext started');
            } catch (err) {
                console.warn('[CAF Receiver] CAF init error:', err);
            }
        }

        const FALLBACK_COVER = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320' viewBox='0 0 24 24' fill='none' stroke='%23333' stroke-width='2'><rect width='20' height='20' x='2' y='2' rx='2'/><circle cx='12' cy='12' r='4'/></svg>";

        // ─── Cover fetcher ───────────────────────────────────────────────────────
        async function updateCover(token) {
            if (token === currentCoverToken) return;
            currentCoverToken = token;
            if (!token) {
                coverEl.src = FALLBACK_COVER;
                backgroundBlur.style.backgroundImage = "none";
                return;
            }
            try {
                const baseUrl = serverBase ? serverBase : '';
                const resp = await fetch(baseUrl + '/api/cover');
                const data = await resp.json();
                if (data.cover) {
                    coverEl.src = data.cover;
                    backgroundBlur.style.backgroundImage = "url('" + data.cover + "')";
                } else {
                    coverEl.src = FALLBACK_COVER;
                    backgroundBlur.style.backgroundImage = "none";
                }
            } catch (err) {
                coverEl.src = FALLBACK_COVER;
                backgroundBlur.style.backgroundImage = "none";
            }
        }

        // ─── Utilities ───────────────────────────────────────────────────────────
        function parseLRC(lrcText) {
            if (!lrcText) return [];
            const result = [];
            const lines = lrcText.split(/\\r?\\n/);
            const timeTagRegex = /\\[(\\d{1,3}):(\\d{2})(?:[.:](\\d{1,3}))?\\]/g;

            for (const line of lines) {
                if (!line.trim()) continue;
                const times = [];
                let match;
                timeTagRegex.lastIndex = 0;

                while ((match = timeTagRegex.exec(line)) !== null) {
                    const min = parseInt(match[1], 10);
                    const sec = parseInt(match[2], 10);
                    let ms = 0;
                    if (match[3]) {
                        const msStr = match[3].padEnd(3, '0').substring(0, 3);
                        ms = parseInt(msStr, 10);
                    }
                    times.push(min * 60 + sec + ms / 1000);
                }

                const text = line.replace(timeTagRegex, '').trim();
                if (text && times.length > 0) {
                    for (const t of times) {
                        result.push({ time: t, text: text });
                    }
                }
            }
            return result.sort((a, b) => a.time - b.time);
        }

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds === null) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return mins + ':' + (secs < 10 ? '0' : '') + secs;
        }

        function renderLyrics(lrcText) {
            lyrics = parseLRC(lrcText);
            currentActiveIndex = -1;
            lyricsScroller.innerHTML = '';
            lyricsScroller.style.transform = 'translateY(0px)';

            if (lyrics.length === 0) {
                lyricsScroller.innerHTML = '<div class="lyric-line" style="text-align:center;">No hay letras cargadas</div>';
                return;
            }
            lyrics.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'lyric-line';
                div.id = 'lyric-' + index;
                div.innerText = item.text;
                lyricsScroller.appendChild(div);
            });
        }

        function syncLyrics(currentTime) {
            if (!lyrics || lyrics.length === 0) return;
            let activeIndex = -1;
            for (let i = 0; i < lyrics.length; i++) {
                if (currentTime >= lyrics[i].time) {
                    activeIndex = i;
                } else {
                    break;
                }
            }

            if (activeIndex === currentActiveIndex) return;
            currentActiveIndex = activeIndex;

            const lines = lyricsScroller.children;
            for (let i = 0; i < lines.length; i++) {
                if (i === activeIndex) {
                    lines[i].classList.add('active');
                    const containerHeight = lyricsScroller.parentElement.clientHeight;
                    const lineOffsetTop  = lines[i].offsetTop;
                    const lineHeight     = lines[i].clientHeight;
                    const targetY        = -(lineOffsetTop - (containerHeight / 2) + (lineHeight / 2));
                    lyricsScroller.style.transform = 'translateY(' + targetY + 'px)';
                } else {
                    lines[i].classList.remove('active');
                }
            }
        }

        function tryPlayAudio() {
            isAutoplayBlocked = false;
            audioPlayer.play().then(() => {
                statusEl.innerText = "Reproduciendo";
                statusEl.style.backgroundColor = "rgba(139,92,246,0.2)";
                statusEl.style.color = "#A78BFA";
                statusEl.style.cursor = "default";
                statusEl.onclick = null;
            }).catch(err => {
                if (err.name === 'NotAllowedError') {
                    isAutoplayBlocked = true;
                    statusEl.innerText = "Haga clic para activar audio";
                    statusEl.style.backgroundColor = "rgba(239,68,68,0.2)";
                    statusEl.style.color = "#FCA5A5";
                    statusEl.style.cursor = "pointer";
                    statusEl.onclick = () => tryPlayAudio();
                }
            });
        }

        // Allow clicking anywhere to unlock browser autoplay if blocked
        document.body.addEventListener('click', () => {
            if (isAutoplayBlocked) {
                tryPlayAudio();
            }
        });

        // ─── Main polling function ───────────────────────────────────────────────
        async function updateState() {
            try {
                const response = await fetch((serverBase ? serverBase : '') + '/api/state');
                if (!response.ok) {
                    throw new Error('Response not OK');
                }
                const state    = await response.json();

                // No active track or stopped
                if (!state.title || state.isStopped) {
                    resetToIdle("No hay canción");
                    return;
                }

                // Cover update
                if (state.coverToken !== currentCoverToken) {
                    updateCover(state.coverToken);
                }

                // Track changed → reload audio immediately
                if (currentSongTitle !== state.title && !isFetchingAudio) {
                    currentSongTitle  = state.title;
                    isFetchingAudio   = true;
                    isAutoplayBlocked = false;
                    lastActionTime    = Date.now();
                    statusEl.innerText = "Cargando audio...";

                    titleEl.innerText  = state.title;
                    artistEl.innerText = state.artist;

                    currentLyricsLRC   = state.lyricsLRC;
                    renderLyrics(state.lyricsLRC);

                    if (state.mediaFileName) {
                        const hostIp    = window.location.hostname || 'localhost';
                        const mediaPort = window.location.port || '8080';
                        const mediaUrl  = (serverBase ? (serverBase + '/static/') : ('http://' + hostIp + ':' + mediaPort + '/static/')) + state.mediaFileName + '?t=' + Date.now();

                        audioPlayer.removeAttribute('src');
                        audioPlayer.src = mediaUrl;

                        if (state.position > 0) {
                            audioPlayer.currentTime = state.position;
                        }

                        audioPlayer.play().then(() => {
                            statusEl.innerText = "Transmitiendo";
                            statusEl.style.backgroundColor = "rgba(139,92,246,0.2)";
                            statusEl.style.color = "#A78BFA";
                        }).catch(err => {
                            if (err.name === 'NotAllowedError') {
                                isAutoplayBlocked = true;
                                statusEl.innerText = "Clic para activar audio";
                                statusEl.style.backgroundColor = "rgba(239,68,68,0.2)";
                                statusEl.style.color = "#FCA5A5";
                                statusEl.style.cursor = "pointer";
                                statusEl.onclick = () => tryPlayAudio();
                            }
                        });
                    }
                    isFetchingAudio = false;
                } else if (!isFetchingAudio) {
                    // Update lyrics if loaded later
                    if (currentLyricsLRC !== state.lyricsLRC) {
                        currentLyricsLRC = state.lyricsLRC;
                        renderLyrics(state.lyricsLRC);
                        syncLyrics(audioPlayer.currentTime);
                    }

                    // Fast state synchronization (400ms cooldown after user actions)
                    if (Date.now() - lastActionTime > 400) {
                        const isNearEnd = audioPlayer.duration && (audioPlayer.currentTime > audioPlayer.duration - 2);
                        const shouldPlay = state.isPlaying && !audioPlayer.ended && !isNearEnd;

                        if (shouldPlay && audioPlayer.paused && !isAutoplayBlocked && !audioPlayer.error) {
                            audioPlayer.play().catch(err => {
                                if (err.name === 'NotAllowedError') {
                                    isAutoplayBlocked = true;
                                    statusEl.innerText = "Clic para activar audio";
                                    statusEl.style.backgroundColor = "rgba(239,68,68,0.2)";
                                    statusEl.style.color = "#FCA5A5";
                                    statusEl.style.cursor = "pointer";
                                    statusEl.onclick = () => tryPlayAudio();
                                }
                            });
                        } else if (!state.isPlaying && !audioPlayer.paused) {
                            audioPlayer.pause();
                        }

                        if (audioPlayer.duration && !audioPlayer.seeking) {
                            const timeDifference = Math.abs(audioPlayer.currentTime - state.position);
                            if (timeDifference > 2) {
                                audioPlayer.currentTime = state.position;
                            }
                        }
                    }

                    if (!isAutoplayBlocked && !audioPlayer.error) {
                        statusEl.innerText = "Transmitiendo";
                        statusEl.style.backgroundColor = "rgba(139,92,246,0.2)";
                        statusEl.style.color = "#A78BFA";
                    }
                }

            } catch (error) {
                // Server offline / LocalCast stopped
                resetToIdle("No hay canción");
            }
        }

        // ─── Audio event handlers ────────────────────────────────────────────────
        audioPlayer.ontimeupdate = () => {
            const current = audioPlayer.currentTime;
            const duration = audioPlayer.duration || 1;
            progressFill.style.width = ((current / duration) * 100) + '%';
            timeCurrentEl.innerText  = formatTime(current);
            timeTotalEl.innerText    = formatTime(duration);
            syncLyrics(current);
        };

        audioPlayer.oncanplay = () => {
            if (!isAutoplayBlocked && audioPlayer.paused) {
                audioPlayer.play().catch(() => {});
            }
        };

        audioPlayer.onended = () => {
            const baseUrl = serverBase ? serverBase : '';
            fetch(baseUrl + '/api/next', { method: 'POST' }).catch(() => {});
        };

        audioPlayer.onerror = () => {
            const err = audioPlayer.error;
            console.error("[AudioErrorEvent] Audio player error:", err);
            statusEl.innerText = "Reintentando audio...";
            statusEl.style.backgroundColor = "rgba(239,68,68,0.2)";
            statusEl.style.color = "#FCA5A5";
            setTimeout(() => {
                currentSongTitle = "";
                updateState();
            }, 1200);
        };

        // ─── Start polling (750ms for snappy sync) ──────────────────────────────
        setInterval(updateState, 750);
        updateState();
    </script>
</body>
</html>
